[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lodandsy"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6>=6.11,<7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]