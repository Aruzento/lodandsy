name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.8'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-*.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -v -o faulthandler_timeout=75 -o faulthandler_exit_on_timeout=true
      - name: Offscreen geometry and data regression checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -v -o faulthandler_timeout=75 -o faulthandler_exit_on_timeout=true
          tests/test_map_fog.py tests/test_map_cursor_ux.py
          tests/test_conflict_resolution.py tests/test_entity_session.py
          tests/test_addressed_validation.py
          tests/test_incremental_save.py tests/test_save_coordinator.py
          tests/test_project_catalogue.py tests/test_project_migrations.py
          tests/test_v001_followup.py
